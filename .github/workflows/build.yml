name: build

# Every push: the test suite on Linux (Python 3.11 and 3.12) and on Windows (core, GUI and
# real-SNMP end-to-end tests), the single-file command-line binaries, and the Windows desktop
# app - which is started in its self-test mode (every page, every export) and screenshotted
# before it is packaged as an installer and a portable zip. A v* tag attaches all of it to a
# release whose notes come from CHANGELOG.md.
#
# A "Version x.y.z" commit on main is always followed by its tag, so the heavy binary jobs
# skip that push and run once, on the tag. Actions are pinned to commit SHAs (Dependabot
# keeps them current). The Linux binary is built on ubuntu-22.04 so it runs on glibc 2.35+.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-build.txt
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - run: pip install -r requirements-build.txt -e ".[gui,test]"
      - name: Bundled data reaches the installed package
        # The EoL table once shipped in no distribution; eol.py then silently returned nothing.
        run: |
          python -c "from subnetsleuth import eol, util; t = eol._load(); assert len(t) > 20, 'eol.json missing/empty'; print(len(t), 'EoL records from', util.resource_path('data', 'eol.json'))"
          python tools/make_sample.py --check
      - name: Tests
        # -rs: every skip with its reason in the log (the snmpsim fixture fails, not skips, when CI is set)
        run: python -m pytest -q -rs --durations=15 tests

  cli:
    # a "Version x.y.z" push to main is immediately followed by its tag: build the binaries once, on the tag
    if: ${{ github.event_name != 'push' || github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'Version ') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: subnetsleuth-cli-windows-x64
            binary: dist/subnetsleuth.exe
          - os: ubuntu-22.04 # glibc 2.35: the binary then runs on Ubuntu 22.04+, Debian 12+, RHEL 9+
            artifact: subnetsleuth-cli-linux-x64
            binary: dist/subnetsleuth
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-build.txt
      - run: pip install -r requirements-build.txt -e .
      - run: pyinstaller subnetsleuth.spec --noconfirm
      # --version proves it starts; rendering the example map proves the bundled vis-network and
      # OUI table came along and openpyxl works; the archive listing proves the EoL table is inside.
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          .\dist\subnetsleuth.exe --version
          .\dist\subnetsleuth.exe render -m examples/lab-map.json --html smoke.html --xlsx smoke.xlsx --csv smoke- --drawio smoke.drawio --no-summary
          if ((Get-Item smoke.html).Length -lt 100000) { throw "vis-network was not embedded" }
          if (!(Test-Path smoke.xlsx)) { throw "xlsx export failed" }
          if (!(Test-Path smoke.drawio)) { throw "drawio export failed" }
          if (!(Select-String -Path smoke-hosts.csv -Pattern "." -Quiet)) { throw "csv export failed" }
          # the archive lists Windows paths with backslashes; compare with one separator
          $listing = (python -m PyInstaller.utils.cliutils.archive_viewer -l dist\subnetsleuth.exe) -replace '\\+', '/'
          foreach ($f in "subnetsleuth/data/eol.json", "subnetsleuth/data/oui.tsv", "subnetsleuth/vendor/vis-network.min.js") {
            if (-not ($listing | Select-String -SimpleMatch -Quiet $f)) { throw "$f is not in the frozen binary" }
          }
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          ./dist/subnetsleuth --version
          ./dist/subnetsleuth render -m examples/lab-map.json --html smoke.html --xlsx smoke.xlsx --csv smoke- --drawio smoke.drawio --no-summary
          test "$(stat -c%s smoke.html)" -gt 100000 || { echo "vis-network was not embedded"; exit 1; }
          test -s smoke.xlsx || { echo "xlsx export failed"; exit 1; }
          test -s smoke.drawio || { echo "drawio export failed"; exit 1; }
          python -m PyInstaller.utils.cliutils.archive_viewer -l dist/subnetsleuth > listing.txt
          for f in subnetsleuth/data/eol.json subnetsleuth/data/oui.tsv subnetsleuth/vendor/vis-network.min.js; do
            grep -qF "$f" listing.txt || { echo "$f is not in the frozen binary"; exit 1; }
          done
          echo "glibc floor of this binary:"; objdump -T dist/subnetsleuth | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  desktop:
    if: ${{ github.event_name != 'push' || github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'Version ') }}
    timeout-minutes: 45
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-build.txt
      - run: pip install -r requirements-build.txt -e ".[gui]"
      - name: Regenerate the bundled sample project
        # the sample is generated from tests/demonet.py; build it fresh so it always matches the code that reads it
        run: python tools/make_sample.py
      - name: Build the app folder
        run: pyinstaller packaging/subnetsleuth-gui.spec --noconfirm
      - name: Version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import subnetsleuth; print(subnetsleuth.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Bundled data files are in the app folder
        shell: pwsh
        run: |
          foreach ($f in "subnetsleuth\data\eol.json", "subnetsleuth\data\oui.tsv", "subnetsleuth\data\sample-campus.sleuth", "subnetsleuth\vendor\vis-network.min.js") {
            if (!(Test-Path "dist\SubnetSleuth\_internal\$f")) { throw "$f missing from dist\SubnetSleuth\_internal" }
          }
      - name: Self-test the frozen app (offscreen)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath dist\SubnetSleuth\SubnetSleuth.exe -ArgumentList "--selftest","--screenshots","shots-offscreen","subnetsleuth\data\sample-campus.sleuth" -Wait -PassThru
          Get-Content shots-offscreen\selftest.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
          .\dist\SubnetSleuth\subnetsleuth-cli.exe --version
          .\dist\SubnetSleuth\subnetsleuth-cli.exe show -m subnetsleuth\data\sample-campus.sleuth | Select-Object -First 5
      - name: Screenshots on the real Windows desktop
        shell: pwsh
        continue-on-error: true
        run: |
          # the runner's desktop is 1024x768; give the app a laptop-sized screen for the pictures
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "could not change resolution: $_" }
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath dist\SubnetSleuth\SubnetSleuth.exe -ArgumentList "--selftest","--screenshots","shots-native","subnetsleuth\data\sample-campus.sleuth" -Wait -PassThru
          if (Test-Path shots-native\selftest.txt) { Get-Content shots-native\selftest.txt }
          if ($p.ExitCode -ne 0) { throw "native self-test failed ($($p.ExitCode))" }
          # and once in the app's own light theme, independent of the runner's classic Windows look
          $p = Start-Process -FilePath dist\SubnetSleuth\SubnetSleuth.exe -ArgumentList "--selftest","--theme","light","--screenshots","shots-light","subnetsleuth\data\sample-campus.sleuth" -Wait -PassThru
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          # download this after a release and run tools/refresh_screenshots.py --from <folder> to update docs/screenshots
          name: subnetsleuth-desktop-screenshots
          path: |
            shots-offscreen
            shots-native
            shots-light
          if-no-files-found: ignore
      - name: Portable zip
        shell: pwsh
        run: |
          # the marker file makes the app keep its settings beside itself instead of in the registry
          Set-Content -Path dist\SubnetSleuth\subnetsleuth-portable.ini -Value "; SubnetSleuth keeps its settings in this folder while this file exists."
          Compress-Archive -Path dist\SubnetSleuth -DestinationPath "dist\SubnetSleuth-${{ steps.ver.outputs.version }}-portable.zip"
          Remove-Item dist\SubnetSleuth\subnetsleuth-portable.ini
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\subnetsleuth.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          Get-ChildItem dist\*.exe, dist\*.zip | Format-Table Name, Length
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: subnetsleuth-desktop-windows-x64
          path: |
            dist/SubnetSleuth-*-setup.exe
            dist/SubnetSleuth-*-portable.zip
          if-no-files-found: error

  release:
    needs: [test, cli, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write # the only job that needs it: it creates the release and uploads the files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Tag, package version and CHANGELOG agree
        id: ver
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import re,pathlib; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("subnetsleuth/__init__.py").read_text()).group(1))')"
          test "$version" = "$pkg" || { echo "tag v$version but subnetsleuth.__version__ is $pkg"; exit 1; }
          python .github/scripts/release_notes.py "$version" --check
          python .github/scripts/release_notes.py "$version" > notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: subnetsleuth-cli-*
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: subnetsleuth-desktop-windows-x64
          path: artifacts/subnetsleuth-desktop-windows-x64
      - name: Collect release files
        run: |
          v="${{ steps.ver.outputs.version }}"
          mkdir -p release
          cp artifacts/subnetsleuth-desktop-windows-x64/* release/
          cp artifacts/subnetsleuth-cli-windows-x64/subnetsleuth.exe "release/subnetsleuth-$v-win-x64.exe"
          cp artifacts/subnetsleuth-cli-linux-x64/subnetsleuth "release/subnetsleuth-$v-linux-x64"
          chmod +x "release/subnetsleuth-$v-linux-x64"
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: SubnetSleuth ${{ steps.ver.outputs.version }}
          body_path: notes.md
          files: release/*
          fail_on_unmatched_files: true

# Keeps the pinned action SHAs in .github/workflows and the pins in requirements-build.txt current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    # pyproject.toml holds minimum versions the app is known to work with; raising them every
    # time a library releases would only exclude users' existing installs. Only the exact
    # pins in requirements-build.txt should move.
    versioning-strategy: increase-if-necessary
    groups:
      build-tooling:
        patterns: ["pyinstaller*", "pytest", "snmpsim", "pysmi"]
      qt:
        patterns: ["PySide6*", "shiboken6"]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netmap"
version = "0.10.0"
description = "Network inventory and topology mapping: a desktop app and CLI that discover devices, links, subnets and hosts over SNMP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["snmp", "network-inventory", "network-topology", "lldp", "cdp", "ipam", "documentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = ["pysnmp>=7.1", "cryptography>=42", "networkx>=3.0", "openpyxl>=3.1", "paramiko>=3.4", "pywinrm>=0.4", "pyvmomi>=8.0"]

[project.urls]
Homepage = "https://github.com/kerbe42/netmap"
Documentation = "https://github.com/kerbe42/netmap#readme"
Changelog = "https://github.com/kerbe42/netmap/blob/main/CHANGELOG.md"
Releases = "https://github.com/kerbe42/netmap/releases"
Issues = "https://github.com/kerbe42/netmap/issues"

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.7"]
keyring = ["keyring>=25"]
test = ["pytest", "snmpsim", "pysmi"]

[project.scripts]
netmap = "netmap.cli:main"

[project.gui-scripts]
netmap-gui = "netmap.gui.app:main"

[tool.setuptools.packages.find]
include = ["netmap*"]

[tool.setuptools.package-data]
# Every file under netmap/data and netmap/vendor must match one of these globs
# (tests/test_packaging.py checks); the frozen builds take the same list from packaging/bundle.py.
netmap = ["vendor/*.js", "data/*.tsv", "data/*.json", "data/*.netmap"]

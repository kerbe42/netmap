[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netmap"
version = "0.1.0"
description = "SNMP/LLDP/CDP-driven network crawler that discovers devices, links and subnets and renders a topology map"
requires-python = ">=3.11"
dependencies = ["pysnmp>=7.1", "cryptography>=42", "networkx>=3.0"]

[project.scripts]
netmap = "netmap.cli:main"

[tool.setuptools.packages.find]
include = ["netmap*"]

[tool.setuptools.package-data]
netmap = ["vendor/*.js"]
